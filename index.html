<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #070707;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* TV Remote Focus Ring */
        .tv-focus {
            outline: none !important;
        }
        .tv-focusable {
            transition: opacity 150ms ease-out !important;
        }
        .tv-focusable.focused {
            outline: 3px solid #ffffff !important;
            outline-offset: 2px !important;
            border-color: #ffffff !important;
            box-shadow: none !important;
            transform: none !important;
            z-index: 10 !important;
        }
        .kb-key.focused {
            background-color: #E50914 !important;
            color: #ffffff !important;
        }
        .hero-gradient {
            background: linear-gradient(180deg, rgba(7,7,7,0) 25%, rgba(7,7,7,0.85) 75%, rgba(7,7,7,1) 100%);
        }
        .home-hero {
            position: relative;
            width: 100%;
            height: 68vh;
            max-height: 720px;
            min-height: 480px;
            overflow: hidden;
            background: #070707;
        }
        .home-hero__image {
            position: absolute;
            inset: 0;
            background-position: center 30%;
            background-size: cover;
            opacity: 0;
            transition: opacity 400ms ease;
            will-change: opacity;
            transform: translateZ(0);
        }
        .home-hero__image.is-visible { opacity: 1; }
        .home-hero__shade {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 16%, rgba(0,0,0,0) 42%, rgba(0,0,0,.5) 68%, rgba(0,0,0,.9) 100%), linear-gradient(90deg, rgba(0,0,0,.76) 0%, rgba(0,0,0,.42) 38%, transparent 78%);
        }
        .home-hero__content {
            position: absolute;
            inset: auto auto 72px 56px;
            z-index: 2;
            width: min(780px, calc(100% - 112px));
        }
        .home-hero__logo {
            display: block;
            max-width: min(460px, 100%);
            max-height: 140px;
            object-fit: contain;
            object-position: left center;
            margin-bottom: 18px;
            opacity: 0;
            transition: opacity 400ms ease;
        }
        .home-hero__logo.is-loaded { opacity: 1; }
        .home-hero__title {
            margin: 0 0 18px;
            font-size: 36px;
            line-height: 1.05;
            font-weight: 800;
        }
        .home-hero__meta { margin: 0 0 14px; color: rgba(255,255,255,.9); font-size: 16px; font-weight: 600; }
        .home-hero__description { max-width: 680px; margin: 0 0 22px; color: rgba(255,255,255,.83); font-size: 15px; line-height: 1.5; }
        .home-hero__actions { display: flex; align-items: center; gap: 16px; }
        .home-hero__actions button { min-height: 52px; padding: 0 24px; border-radius: 5px; font-size: 18px; font-weight: 700; }
        .home-hero__list { color: #fff; border: 1px solid rgba(255,255,255,.8); background: rgba(30,30,30,.72); }
        .home-hero__dots { position: absolute; z-index: 3; bottom: 20px; left: 50%; display: flex; align-items: center; gap: 10px; transform: translateX(-50%); }
        .home-hero__dot { width: 22px; height: 9px; padding: 0; border: 0; border-radius: 8px; background: rgba(255,255,255,.5); transform: scaleX(.4); transform-origin: center; }
        .home-hero__dot.is-active { background: #fff; transform: scaleX(1); }
        .home-collection-title { margin: 0; font-size: 18px; font-weight: 700; }
        .home-poster-card { width: 140px !important; min-width: 140px !important; border-radius: 8px !important; }
        .home-collection-track { gap: 12px; }
        @media (max-width: 700px) {
            .home-hero { height: 68vh; min-height: 440px; }
            .home-hero__content { inset: auto 6% 62px; width: 88%; }
            .home-hero__title { font-size: 36px; }
            .home-hero__logo { max-width: min(320px, 85%); max-height: 90px; }
            .home-poster-card { width: 140px !important; min-width: 140px !important; }
        }
        .card-item {
            width: 8rem !important;
            min-width: 8rem !important;
            transition: transform 150ms ease, opacity 150ms ease;
        }
        .card-item > div:first-child,
        .card-item .card-media,
        .card-item .h-60,
        .card-item .h-40 {
            height: 11.5rem !important;
        }
        .skeleton,
        .card-item .skeleton,
        .card-item > .skeleton {
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
            animation: inline-pulse 1.5s ease-in-out infinite;
        }
        @keyframes inline-pulse { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
        .card-item img {
            background-color: #181818;
        }

        .app-splash {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at center, #111 0%, #070707 38%, #000000 100%);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 180ms ease, visibility 180ms ease;
            overflow: hidden;
        }
        .app-splash.is-visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .app-splash[hidden] {
            display: none !important;
        }
        .splash-mark {
            position: relative;
            z-index: 1;
            color: transparent;
            background: linear-gradient(115deg, #7f0d14 0%, #e50914 48%, #ff4d5d 55%, #b20710 100%);
            background-clip: text;
            -webkit-background-clip: text;
            font-size: 240px;
            font-weight: 900;
            line-height: 0.8;
            text-shadow: 0 0 12px rgba(229, 9, 20, .55);
            transform: translateZ(0);
        }
        .splash-sweep {
            position: absolute;
            z-index: 2;
            top: -20%;
            left: -60%;
            width: 40%;
            height: 140%;
            background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,.55) 50%, transparent 100%);
            animation: splash-sweep-anim 2.5s ease-in-out infinite;
            pointer-events: none;
            will-change: transform, opacity;
            transform: translateZ(0);
        }
        @keyframes splash-sweep-anim {
            0% { transform: translate3d(0,0,0); opacity: 0; }
            20%, 60% { opacity: 1; }
            100% { transform: translate3d(400%,0,0); opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .app-splash, .splash-mark, .splash-sweep { transition: none; animation: none; }
        }

        .details-page {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            background: #141414;
        }
        .netflix-details-shell {
            position: relative;
            width: 100%;
            min-height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(10,10,10,0.92) 0%, rgba(20,20,20,1) 25%, rgba(20,20,20,1) 100%);
        }
        .netflix-details-cover {
            position: relative;
            min-height: 62vh;
            background-size: cover;
            background-position: center 25%;
            display: flex;
            align-items: flex-end;
            padding: 4rem clamp(1.5rem, 5vw, 5rem) 3rem;
            isolation: isolate;
        }
        .netflix-details-cover::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 30%, rgba(0,0,0,0.18) 60%, rgba(0,0,0,0.78) 100%);
            z-index: 0;
        }
        .netflix-details-cover::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(20,20,20,0) 25%, rgba(20,20,20,0.72) 75%, rgba(20,20,20,1) 100%);
            z-index: 1;
        }
        .netflix-details-content {
            position: relative;
            z-index: 2;
            max-width: 760px;
        }
        .details-metadata {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1rem;
            color: rgba(255,255,255,0.9);
            font-size: 0.78rem;
            font-weight: 600;
        }
        .details-certification {
            min-width: 30px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 0.35rem;
            border-radius: 3px;
            background: #f5c518;
            color: #111;
            font-weight: 900;
        }
        .details-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
        }
        .details-meta-item::before {
            content: "•";
            color: rgba(255,255,255,0.55);
        }
        .details-back-button {
            position: absolute;
            top: 1.5rem;
            left: clamp(1.5rem, 5vw, 5rem);
            z-index: 3;
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            min-height: 42px;
            padding: 0 1rem;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 999px;
            background: rgba(0,0,0,0.58);
            color: #fff;
            font-size: 0.78rem;
            font-weight: 700;
        }
        .detail-badges {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 0.9rem;
        }
        .detail-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            background: rgba(229, 9, 20, 0.95);
            color: white;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .detail-pill--muted {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.14);
            color: rgba(255,255,255,0.9);
            letter-spacing: 0.08em;
            padding: 0.35rem 0.6rem;
        }
        .detail-pill--green {
            background: rgba(34, 197, 94, 0.14);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
            letter-spacing: 0.04em;
        }
        .netflix-title {
            font-size: clamp(2rem, 3vw, 4rem);
            font-weight: 900;
            line-height: 0.96;
            letter-spacing: -0.04em;
            margin: 0;
            color: #fff;
            text-shadow: 0 8px 24px rgba(0,0,0,0.45);
        }
        .detail-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 1.2rem;
            flex-wrap: wrap;
        }
        .detail-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            min-width: 150px;
            height: 46px;
            border-radius: 12px;
            padding: 0 1.25rem;
            font-weight: 800;
            font-size: 0.82rem;
            text-transform: none;
            transition: opacity 0.15s ease;
        }
        .detail-btn--primary {
            background: #fff;
            color: #111;
        }
        .detail-btn--secondary {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .netflix-details-panel {
            padding: 2rem clamp(1.5rem, 5vw, 5rem) 3rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            background: rgba(20,20,20,0.96);
            max-width: 1500px;
            margin: 0 auto;
        }
        .netflix-details-grid {
            display: grid;
            grid-template-columns: 1.7fr 1fr;
            gap: 1.5rem;
        }
        .netflix-copy {
            color: rgba(255,255,255,0.88);
        }
        .netflix-copy p {
            margin: 0;
            color: rgba(255,255,255,0.75);
            font-size: 0.92rem;
            line-height: 1.8;
            max-width: 780px;
        }
        .netflix-copy .details-genres {
            margin-top: 0.9rem;
            color: rgba(255,255,255,0.92);
            font-size: 0.8rem;
            font-weight: 700;
        }
        .detail-round-btn {
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            background: rgba(30,30,30,0.75);
            color: #fff;
            font-size: 1rem;
        }
        .details-comments {
            border-top: 1px solid rgba(255,255,255,0.12);
            padding-top: 1.25rem;
        }
        .details-comments h3 {
            margin: 0 0 0.45rem;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 800;
        }
        .details-comments p {
            margin: 0;
            color: rgba(255,255,255,0.58);
            font-size: 0.78rem;
        }
        #platformFilterList {
            padding: 8px 12px 10px;
            margin: -8px -12px -10px;
            scroll-padding-inline: 12px;
        }
        .carousel-track {
            padding: 8px 14px 12px;
            margin: -8px -14px -12px;
            scroll-padding-inline: 14px;
            scroll-behavior: auto;
        }
        .detail-side {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            color: rgba(255,255,255,0.8);
            font-size: 0.75rem;
        }
        .detail-side strong {
            color: rgba(255,255,255,0.55);
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .detail-side .detail-value {
            color: rgba(255,255,255,0.9);
            line-height: 1.6;
        }
        @media (max-width: 900px) {
            .netflix-details-cover {
                min-height: 58vh;
                padding-bottom: 2rem;
            }
            .netflix-details-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 600px) {
            .netflix-details-cover {
                min-height: 68vh;
                background-position: 58% center;
                padding-top: 5rem;
            }
            .netflix-details-panel {
                padding-top: 1.5rem;
            }
            .detail-btn {
                min-width: 0;
                flex: 1;
            }
            .details-metadata {
                gap: 0.55rem;
                font-size: 0.7rem;
            }
        }
    </style>

<body class="h-screen w-screen flex flex-col overflow-hidden bg-[#070707]">

    <div id="appSplash" class="app-splash is-visible" role="status" aria-label="Carregando Vênus Cine">
        <span class="splash-mark" aria-hidden="true">V</span>
            <span class="splash-sweep" aria-hidden="true"></span>
    </div>


    <nav id="navbar" class="topbar" aria-label="Navegação principal">
        <div class="topbar-left">
            <span class="topbar__brand">VÊNUS CINE</span>
        </div>
        <div class="topbar-center">
            <button type="button" data-nav-id="btn-search-trigger" class="tv-focusable topbar-icon-btn" onclick="openSearchModal()" title="Pesquisar" aria-label="Pesquisar">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            </button>
            <button type="button" data-nav-id="tab-home" data-route="home" id="nav-home" class="tv-focusable topbar-link nav-link" onclick="switchTab('home')" aria-current="page"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Início</span></button>
            <button type="button" data-nav-id="tab-series" data-route="series" id="nav-series" class="tv-focusable topbar-link nav-link" onclick="switchTab('series')"><i class="fa-solid fa-tv" aria-hidden="true"></i><span>Séries</span></button>
            <button type="button" data-nav-id="tab-movies" data-route="movies" id="nav-movies" class="tv-focusable topbar-link nav-link" onclick="switchTab('movies')"><i class="fa-solid fa-film" aria-hidden="true"></i><span>Filmes</span></button>
            <button type="button" data-nav-id="tab-watchlist" data-route="watchlist" id="nav-watchlist" class="tv-focusable topbar-link nav-link" onclick="switchTab('watchlist')"><i class="fa-solid fa-bookmark" aria-hidden="true"></i><span>Minha Lista</span></button>
        </div>
        <div class="topbar-right" aria-hidden="true"></div>
    </nav>


    <main id="catalogPage" class="flex-grow overflow-y-auto no-scrollbar pb-16">
        <!-- Hero Section with Skeleton Support -->
        <section id="heroSection" class="home-hero skeleton tv-focusable" data-nav-id="hero-card" data-row="hero" tabindex="0" aria-label="Destaque principal">
            <img id="heroImageA" class="home-hero__image" alt="" loading="eager" decoding="async" fetchpriority="high">
            <img id="heroImageB" class="home-hero__image" alt="" loading="eager" decoding="async" fetchpriority="high">
            <div class="home-hero__shade"></div>
            <div class="home-hero__content">
                <div id="heroLogoWrap" class="home-hero__logo-wrap">
                    <img id="heroLogo" class="home-hero__logo" alt="" loading="eager" decoding="async" fetchpriority="high">
                </div>
                <h1 id="heroTitle" class="home-hero__title"></h1>
                <div id="heroMeta" class="home-hero__meta"></div>
                <p id="heroDesc" class="home-hero__description line-clamp-3"></p>
                <div class="home-hero__actions">
                    <button type="button" data-nav-id="hero-play" data-row="hero" data-focusable="true" id="heroPlayBtn" class="tv-focusable hero-btn btn-assistir bg-white hover:bg-gray-200 text-black cursor-pointer">
                        <i class="fa-solid fa-play mr-2" aria-hidden="true"></i>Assistir
                    </button>
                    <button type="button" data-nav-id="hero-info" data-row="hero" data-focusable="true" id="heroInfoBtn" class="tv-focusable hero-btn btn-minha-lista home-hero__list cursor-pointer" aria-label="Adicionar à Minha Lista">
                        <span id="heroListIcon" aria-hidden="true">+</span> <span id="heroListText">Minha Lista</span>
                    </button>
                </div>
            </div>
        </section>
        <div id="heroDots" class="home-hero__dots" aria-label="Navegação dos destaques"></div>

        <section id="platformBrowse" class="hidden px-8 mt-5" aria-label="Categorias">
            <h2 class="text-xs lg:text-sm font-bold text-white tracking-wide mb-2.5">CATEGORIAS</h2>
            <div id="platformFilterList" class="flex gap-3 overflow-x-auto no-scrollbar"></div>
        </section>

    <script>
        let currentTab = 'home';

        let seriesInfoCache = {};
        const detailsInfoCache = new Map();
        let watchlist = JSON.parse(localStorage.getItem('venus_watchlist_tv') || '[]');
        let currentSelectedItem = null;
        let currentHls = null;
        const MAX_CARDS_PER_ROW = 8;
        let batchSize = MAX_CARDS_PER_ROW;
        let currentGroupedCatalog = [];
        let renderedCategoryCount = 0;
        let catalogCategories = { filmes: [], series: [] };
        let currentCatalogCategory = '';
        let focusableElements = [];
        let focusedElement = null;
        const scrollAnimationFrames = new WeakMap();
        const catalogApiPages = {
            movies: { page: 0, hasNext: false, category: '' },
            series: { page: 0, hasNext: false, category: '' }
        };
        let lazyImageObserver = null;
        let lazyCollectionObserver = null;
        const catalogRows = new Map();
        const CATALOG_CACHE_DB = 'venus-cine-catalog';
        const CATALOG_CACHE_STORE = 'catalog';
        const CATALOG_CACHE_KEY = 'public-api-catalog-v1';
        const CATALOG_CACHE_TTL = 15 * 60 * 1000;
        let catalogCacheDatabasePromise = null;
        let splashHideTimer = 0;
        let splashSafetyTimer = 0;

        function openCatalogCache() {
            if (!('indexedDB' in window)) return Promise.resolve(null);
            if (catalogCacheDatabasePromise) return catalogCacheDatabasePromise;
            catalogCacheDatabasePromise = new Promise(resolve => {
                const request = indexedDB.open(CATALOG_CACHE_DB, 1);
                request.onupgradeneeded = () => {
                    const database = request.result;
                    if (!database.objectStoreNames.contains(CATALOG_CACHE_STORE)) {
                        database.createObjectStore(CATALOG_CACHE_STORE);
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => resolve(null);
                request.onblocked = () => resolve(null);
            });
            return catalogCacheDatabasePromise;
        }

        async function readCatalogCache() {
            const database = await openCatalogCache();
            if (!database) return null;
            return new Promise(resolve => {
                const transaction = database.transaction(CATALOG_CACHE_STORE, 'readonly');
                const request = transaction.objectStore(CATALOG_CACHE_STORE).get(CATALOG_CACHE_KEY);
                request.onsuccess = () => {
                    const cached = request.result;
                    if (!cached || !Array.isArray(cached.movies) || !Array.isArray(cached.series)) {
                        resolve(null);
                        return;
                    }
                    const movies = cached.movies.map(item => ({ ...item, url: item.url || null }));
                    const series = cached.series.map(item => ({ ...item, url: item.url || null }));
                    resolve({ movies, series, savedAt: Number(cached.savedAt) || 0 });
                };
                request.onerror = () => resolve(null);
            });
        }

        async function writeCatalogCache() {
            const database = await openCatalogCache();
            if (!database) return;
            const stripStreamUrl = ({ url, url_stream, apiItem, ...item }) => item;
            const payload = {
                savedAt: Date.now(),
                movies: catalogData.movies.map(stripStreamUrl),
                series: catalogData.series.map(stripStreamUrl)
            };
            await new Promise(resolve => {
                const transaction = database.transaction(CATALOG_CACHE_STORE, 'readwrite');
                transaction.objectStore(CATALOG_CACHE_STORE).put(payload, CATALOG_CACHE_KEY);
                transaction.oncomplete = resolve;
                transaction.onerror = resolve;
                transaction.onabort = resolve;
            });
        }

        function hideAppSplash() {
            const splash = document.getElementById('appSplash');
            if (!splash) return;
            splash.classList.remove('is-visible');
            clearTimeout(splashHideTimer);
            clearTimeout(splashSafetyTimer);
            splashHideTimer = setTimeout(() => { splash.hidden = true; }, 200);
        }

        function showAppSplash() {
            const splash = document.getElementById('appSplash');
            if (!splash) return;
            clearTimeout(splashHideTimer);
            clearTimeout(splashSafetyTimer);
            splash.hidden = false;
            requestAnimationFrame(() => splash.classList.add('is-visible'));
            splashSafetyTimer = setTimeout(hideAppSplash, 1500);
        }

        function initLazyImageObserver() {
            if (!('IntersectionObserver' in window)) return;
            lazyImageObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    loadObservedImage(entry.target);
                    lazyImageObserver.unobserve(entry.target);
                });
            }, { rootMargin: '240px 120px', threshold: 0.01 });
            lazyCollectionObserver = new IntersectionObserver(entries => {
                const sentinel = entries.find(entry => entry.isIntersecting)?.target;
                if (!sentinel?.isConnected) return;
                lazyCollectionObserver.unobserve(sentinel);
                sentinel.remove();
                appendNextCatalogGroups();
            }, { root: document.getElementById('catalogPage'), rootMargin: '500px 0px', threshold: 0.01 });
        }

        function loadObservedImage(image) {
            const source = image.dataset.src;
            if (!source) return;
            image.onload = () => {
                image.parentElement?.classList.remove('skeleton');
                image.classList.remove('opacity-0');
            };
            image.onerror = () => {
                image.onerror = null;
                image.src = 'https://placehold.co/200x300/222/fff?text=V%C3%AAnusCine';
                image.parentElement?.classList.remove('skeleton');
                image.classList.remove('opacity-0');
            };
            image.src = source;
            delete image.dataset.src;
        }

        function observeLazyImages(root) {
            const images = root.querySelectorAll('img[data-src]');
            if (!lazyImageObserver) {
                images.forEach(loadObservedImage);
                return;
            }
            images.forEach(image => lazyImageObserver.observe(image));
        }

        function scrollElementTo(scroller, target, duration = 180) {
            if (!scroller || !target) return;
            const previousFrame = scrollAnimationFrames.get(scroller);
            if (previousFrame) cancelAnimationFrame(previousFrame);
            const start = scroller.scrollTop;
            const targetTop = Math.max(0, start + target.getBoundingClientRect().top - scroller.getBoundingClientRect().top - 12);
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || Math.abs(targetTop - start) < 2) {
                scroller.scrollTop = targetTop;
                return;
            }
            const startTime = performance.now();
            const animate = now => {
                const progress = Math.min((now - startTime) / duration, 1);
                const eased = 1 - (1 - progress) * (1 - progress);
                scroller.scrollTop = start + (targetTop - start) * eased;
                if (progress < 1) scrollAnimationFrames.set(scroller, requestAnimationFrame(animate));
                else scrollAnimationFrames.delete(scroller);
            };
            scrollAnimationFrames.set(scroller, requestAnimationFrame(animate));
        }

        function scrollDetailsTo(targetId) {
            scrollElementTo(document.getElementById('detailsPage'), document.getElementById(targetId));
        }

        function displayMetadata(value, fallback) {
            if (Array.isArray(value)) return value.filter(Boolean).join(' • ') || fallback;
            if (value === null || value === undefined || value === '') return fallback;
            return String(value).replace(/,\s*/g, ' • ');
        }

        function formatDuration(item) {
            const seconds = Number(item.durationSeconds);
            if (Number.isFinite(seconds) && seconds > 0) return `${Math.round(seconds / 60)} min`;
            const duration = item.duration || '';
            if (typeof duration === 'number') return `${duration} min`;
            if (/^\d+$/.test(String(duration))) return `${duration} min`;
            const match = String(duration).match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
            if (match) {
                const minutes = Number(match[1]) * (match[3] ? 60 : 1) + Number(match[2]);
                return `${minutes} min`;
            }
            return displayMetadata(duration, 'Duração não informada');
        }

        function applyDetailsMetadata(item) {
            const title = document.getElementById('modalTitle');
            const titleLogo = document.getElementById('modalTitleLogo');
            const titleLogoWrap = document.getElementById('modalTitleLogoWrap');
            const logoUrl = item.titleLogo || '';
            title.textContent = item.name || 'Título';
            titleLogo.onerror = () => {
                titleLogoWrap.classList.remove('loaded');
                titleLogoWrap.hidden = true;
                titleLogo.classList.add('hidden');
                title.classList.remove('hidden');
            };
            titleLogo.onload = () => titleLogoWrap.classList.add('loaded');
            if (logoUrl) {
                titleLogoWrap.hidden = false;
                titleLogoWrap.classList.remove('loaded');
                titleLogo.src = logoUrl;
                titleLogo.alt = item.name || 'Logo do título';
                titleLogo.classList.remove('hidden');
                title.classList.add('hidden');
                if (titleLogo.complete && titleLogo.naturalWidth > 0) titleLogoWrap.classList.add('loaded');
            } else {
                titleLogoWrap.hidden = true;
                titleLogoWrap.classList.remove('loaded');
                titleLogo.removeAttribute('src');
                titleLogo.classList.add('hidden');
                title.classList.remove('hidden');
            }

            const backdrop = Array.isArray(item.backdrop) ? item.backdrop[0] : item.backdrop;
            document.getElementById('modalBackdrop').style.backgroundImage = `url("${backdrop || item.logo}")`;
            document.getElementById('modalGroup').textContent = item.group || (item.type === 'series' ? 'Série' : 'Filme');
            const certification = document.getElementById('modalCertification');
            const certificationBadge = VenusSlider.createAgeRatingBadge(item.maturityRating);
            certification.className = 'details-certification badge-classificacao';
            certification.replaceChildren();
            if (certificationBadge) {
                certification.classList.add(...certificationBadge.className.split(' '));
                certification.textContent = certificationBadge.textContent;
                certification.setAttribute('aria-label', certificationBadge.getAttribute('aria-label'));
            } else {
                certification.textContent = '--';
                certification.removeAttribute('aria-label');
            }
            document.getElementById('modalAudio').textContent = displayMetadata(item.audio, 'Áudio não informado');
            document.getElementById('modalDuration').textContent = formatDuration(item);
            document.getElementById('modalYear').textContent = displayMetadata(item.year, 'Ano não informado');
            document.getElementById('modalDescription').textContent = item.plot || 'Sinopse indisponível.';
            document.getElementById('modalGenres').textContent = displayMetadata(item.genre, 'Gênero não informado');
            document.getElementById('modalCast').textContent = item.cast || 'Elenco não informado';
        }

        function getTitleDetails(item) {
            if (item.detailLoaded) return Promise.resolve(item);
            const cacheKey = `${item.type}:${item.id}`;
            if (!detailsInfoCache.has(cacheKey)) {
                const request = VenusCatalog.details(item).catch(error => {
                    detailsInfoCache.delete(cacheKey);
                    throw error;
                });
                detailsInfoCache.set(cacheKey, request);
            }
            return detailsInfoCache.get(cacheKey);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initLazyImageObserver();
            VenusSpatialNav.init({
                onBack: handleBackNavigation,
                onFocus: syncFocusedElement,
                onInteraction: () => VenusSlider.pause(15000)
            });
            const catalogPage = document.getElementById('catalogPage');
            catalogPage.addEventListener('scroll', () => {
                document.getElementById('navbar').classList.toggle('scrolled', catalogPage.scrollTop > 16);
            }, { passive: true });
            initApp();
        });

        async function initApp() {
            showAppSplash();
            renderSkeletonState();
            try {
                const [payload, categories] = await Promise.all([
                    VenusHome.fetchDashboard(),
                    VenusCatalog.categories().catch(error => {
                        console.warn('[Catalog] categories unavailable:', error);
                        return { filmes: [], series: [] };
                    })
                ]);
                catalogCategories = {
                    filmes: Array.isArray(categories.filmes) ? categories.filmes : [],
                    series: Array.isArray(categories.series) ? categories.series : []
                };
                applyHomeDashboard(payload);
                switchTab('home');
                setupHomeHero();
                VenusSkeleton.finishHome(document.getElementById('heroSection'));
                updateFocusables();
                hideAppSplash();
                requestAnimationFrame(() => {
                    setFocus(document.getElementById('heroSection'));
                });
                void hydrateCatalogData();
            } catch (error) {
                homeDashboard = null;
                const cached = await readCatalogCache();
                if (cached) {
                    catalogData = { movies: cached.movies, series: cached.series };
                    switchTab(currentTab);
                    updateFocusables();
                    hideAppSplash();
                    return;
                }
                showApiConnectionError(error);
            }
        }

        function mapHomeItem(item) {
            const type = item.tipo === 'serie' ? 'series' : 'movies';
            return {
                id: String(item.id ?? ''),
                type,
                name: item.titulo || 'Título indisponível',
                logo: VenusCatalog.optimizeImage(item.capa, 'card'),
                titleLogo: item.logo || '',
                backdrop: VenusCatalog.optimizeImage(item.banner, 'hero'),
                maturityRating: item.classificacao || '',
                rating: item.score ?? '',
                year: item.ano ?? '',
                genre: Array.isArray(item.generos) ? item.generos.join(', ') : (item.generos || ''),
                plot: item.sinopse || '',
                cast: '',
                url_stream: item.url_stream || null,
                url: item.url_stream || null,
                streamExtension: 'mp4'
            };
        }

        function applyHomeDashboard(payload) {
            homeDashboard = {
                collections: payload.colecoes.map(collection => ({
                    id: String(collection.id || collection.titulo || ''),
                    title: collection.titulo || 'Coleção',
                    total: Number(collection.total) || (Array.isArray(collection.items) ? collection.items.length : 0),
                    items: (Array.isArray(collection.items) ? collection.items : []).map(mapHomeItem)
                }))
            };
            homeHeroSlides = payload.hero.slice(0, 5).map(mapHomeItem);
            const uniqueItems = new Map();
            [...homeHeroSlides, ...homeDashboard.collections.flatMap(collection => collection.items)].forEach(item => {
                if (item.id) uniqueItems.set(`${item.type}:${item.id}`, item);
            });
            const items = [...uniqueItems.values()];
            catalogData = {
                movies: items.filter(item => item.type === 'movies'),
                series: items.filter(item => item.type === 'series')
            };
        }

        function setupHomeHero() {
            if (!homeHeroSlides.length) {
                document.getElementById('heroSection').classList.add('hidden');
                return;
            }
            document.getElementById('heroSection').classList.remove('hidden');
            VenusSkeleton.finishHome(document.getElementById('heroSection'));
            VenusSlider.init(homeHeroSlides, {
                onPlay: item => item.type === 'series' ? openDetailsModal(item) : playItem(item),
                onList: item => toggleWatchlist(item.id),
                onSlide: item => {
                    activeHomeHeroItem = item;
                    syncHeroWatchlistButton(item);
                }
            });
        }

        function syncHeroWatchlistButton(item = activeHomeHeroItem) {
            const saved = item && watchlist.includes(String(item.id));
            document.getElementById('heroListIcon').textContent = saved ? '✓' : '+';
            document.getElementById('heroListText').textContent = saved ? 'Na Minha Lista' : 'Minha Lista';
            document.getElementById('heroInfoBtn').setAttribute('aria-label', saved ? 'Remover da Minha Lista' : 'Adicionar à Minha Lista');
        }

        function showApiConnectionError(error) {
            hideAppSplash();
            const container = document.getElementById('catalogContainer');
            const panel = document.createElement('div');
            panel.className = 'text-center py-12 text-gray-400';
            const errorText = document.createElement('p');
            errorText.className = 'text-sm mb-3';
            errorText.textContent = error?.message || 'Não foi possível carregar o catálogo público.';
            const retryButton = document.createElement('button');
            retryButton.type = 'button';
            retryButton.dataset.navId = 'retry-connection';
            retryButton.className = 'tv-focusable mt-4 bg-venus-red hover:bg-venus-darkred px-5 py-2.5 rounded-lg text-sm font-bold text-white';
            retryButton.textContent = 'Tentar novamente';
            retryButton.onclick = initApp;
            panel.append(errorText, retryButton);
            container.replaceChildren(panel);
            updateFocusables();
        }

        function renderSkeletonState() {
            const hero = document.getElementById('heroSection');
            VenusSkeleton.renderHome(hero, document.getElementById('catalogContainer'));
            document.getElementById('heroLogoWrap').hidden = true;
            document.getElementById('heroTitle').innerText = '';
            document.getElementById('heroDesc').innerText = '';
            document.getElementById('heroMeta').innerText = '';
        }

        async function hydrateCatalogData() {
            const homeItems = [...homeHeroSlides, ...homeDashboard.collections.flatMap(collection => collection.items)];
            try {
                const [moviePage, seriesPage] = await Promise.all([
                    VenusCatalog.list('movies', 1),
                    VenusCatalog.list('series', 1)
                ]);
                catalogApiPages.movies = { page: moviePage.page, hasNext: moviePage.has_next, category: '' };
                catalogApiPages.series = { page: seriesPage.page, hasNext: seriesPage.has_next, category: '' };
                const mergedItems = new Map();
                [...moviePage.items, ...seriesPage.items].forEach(item => {
                    mergedItems.set(`${item.type}:${String(item.id)}`, item);
                });
                homeItems.forEach(item => {
                    const key = `${item.type}:${String(item.id)}`;
                    const existing = mergedItems.get(key);
                    mergedItems.set(key, existing ? {
                        ...existing,
                        ...item,
                        titleLogo: item.titleLogo || existing.titleLogo,
                        backdrop: item.backdrop || existing.backdrop,
                        genre: item.genre || existing.genre,
                        plot: item.plot || existing.plot,
                        url: item.url || existing.url
                    } : item);
                });
                const items = [...mergedItems.values()];
                catalogData = {
                    movies: items.filter(item => item.type !== 'series'),
                    series: items.filter(item => item.type === 'series')
                };
                renderPlatformFilters();
                if (currentTab !== 'home') {
                    renderCurrentCatalog();
                    updateFocusables();
                }
                writeCatalogCache().catch(() => {});
                console.log(`[Home] catalog hydrated: ${catalogData.movies.length} movies, ${catalogData.series.length} series`);
            } catch (error) {
                console.warn('[Catalog] public list endpoints unavailable:', error);
                if (currentTab !== 'home') showApiConnectionError(error);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            VenusTopbar.setActive(tab);
            currentCatalogCategory = catalogApiPages[tab]?.category || '';
            renderPlatformFilters();

            ['home', 'movies', 'series', 'watchlist'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    btn.classList.toggle('active', t === tab);
                }
            });

            renderCurrentCatalog();
            updateFocusables();
        }

        function renderPlatformFilters() {
            const container = document.getElementById('platformFilterList');
            if (!container) return;
            const section = document.getElementById('platformBrowse');
            const isCatalogTab = currentTab === 'movies' || currentTab === 'series';
            section.classList.toggle('hidden', !isCatalogTab);
            if (!isCatalogTab) {
                container.replaceChildren();
                return;
            }
            const categories = catalogCategories[currentTab === 'movies' ? 'filmes' : 'series'];
            const options = [{ name: 'Todas', value: '' }, ...categories.map(name => ({ name, value: name }))];
            const fragment = document.createDocumentFragment();
            options.forEach(category => {
                const selected = currentCatalogCategory === category.value;
                const button = document.createElement('button');
                button.type = 'button';
                button.dataset.navId = `category-${sanitizeId(category.value || 'all')}`;
                button.setAttribute('aria-pressed', String(selected));
                button.className = `tv-focusable genre-chip flex-none ${selected ? 'is-selected' : ''}`;
                button.textContent = category.name;
                button.onclick = () => filterByCategory(category.value);
                fragment.appendChild(button);
            });
            container.replaceChildren(fragment);
        }

        async function filterByCategory(category) {
            const type = currentTab;
            currentCatalogCategory = category;
            try {
                const page = await VenusCatalog.list(type, 1, 30, category);
                catalogData[type] = page.items;
                catalogApiPages[type] = { page: page.page, hasNext: page.has_next, category };
                renderPlatformFilters();
                renderCurrentCatalog();
                updateFocusables();
            } catch (error) {
                showApiConnectionError(error);
            }
        }

        function renderCurrentCatalog() {
            const container = document.getElementById('catalogContainer');
            const oldSentinel = container.querySelector('[data-collection-sentinel]');
            if (oldSentinel) lazyCollectionObserver?.unobserve(oldSentinel);
            container.replaceChildren();
            catalogRows.clear();
            currentGroupedCatalog = [];
            renderedCategoryCount = 0;

            let itemsToRender = [];
            if (currentTab === 'home') itemsToRender = [...catalogData.movies, ...catalogData.series];
            else if (currentTab === 'movies') itemsToRender = catalogData.movies;
            else if (currentTab === 'series') itemsToRender = catalogData.series;
            else if (currentTab === 'watchlist') {
                const all = [...catalogData.movies, ...catalogData.series];
                itemsToRender = all.filter(i => watchlist.includes(i.id.toString()));
            }

            if (homeDashboard && currentTab === 'home') {
                currentGroupedCatalog = homeDashboard.collections.map(collection => [collection.title, collection.items, collection.id]);
                appendNextCatalogGroups();
                return;
            }

            if (itemsToRender.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-400 text-xs">Nenhum conteúdo encontrado nesta seção.</div>`;
                return;
            }

            const grouped = new Map();
            itemsToRender.forEach(item => {
                const groupName = item.group || (item.type === 'movies' ? 'Filmes Populares' : 'Séries em Destaque');
                if (!grouped.has(groupName)) grouped.set(groupName, []);
                grouped.get(groupName).push(item);
            });
            currentGroupedCatalog = [...grouped.entries()];
            appendNextCatalogGroups();
        }

        function appendNextCatalogGroups() {
            const container = document.getElementById('catalogContainer');
            container.querySelector('[data-nav-id="more-categories"]')?.remove();
            const oldSentinel = container.querySelector('[data-collection-sentinel]');
            if (oldSentinel) lazyCollectionObserver?.unobserve(oldSentinel);
            oldSentinel?.remove();
            const fragment = document.createDocumentFragment();
            const end = currentGroupedCatalog.length;
            const batchEnd = homeDashboard && currentTab === 'home'
                ? Math.min(renderedCategoryCount + 3, end)
                : end;

            while (renderedCategoryCount < batchEnd) {
                const [groupName, groupItems, collectionId] = currentGroupedCatalog[renderedCategoryCount++];
                const row = createCatalogRow(groupName, groupItems, collectionId);
                catalogRows.set(row.dataset.row, {
                    items: groupItems,
                    isTopTen: String(collectionId || '').startsWith('top10_'),
                    type: currentTab === 'movies' || currentTab === 'series' ? currentTab : null
                });
                fragment.appendChild(row);
            }

            let sentinel = null;
            if (renderedCategoryCount < end) {
                sentinel = document.createElement('div');
                sentinel.className = 'collection-load-sentinel skeleton-row';
                sentinel.dataset.collectionSentinel = 'true';
                sentinel.setAttribute('aria-hidden', 'true');
                sentinel.innerHTML = '<div class="skeleton-heading"></div><div class="skeleton-card-track"><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div></div>';
                fragment.appendChild(sentinel);
            }

            container.appendChild(fragment);
            if (sentinel && lazyCollectionObserver) lazyCollectionObserver.observe(sentinel);
            if (sentinel && !lazyCollectionObserver) {
                sentinel.remove();
                appendNextCatalogGroups();
                return;
            }
            observeLazyImages(container);
            updateFocusables();
        }

        function createCatalogRow(groupName, groupItems, collectionId = '') {
            const rowId = `row-${sanitizeId(collectionId || groupName)}`;
            const isTopTen = String(collectionId).startsWith('top10_');
            const isTopTenMovies = String(collectionId).startsWith('top10_filmes');
            const isTopTenSeries = String(collectionId).startsWith('top10_series');
            const displayGroupName = isTopTenMovies ? 'Filmes Top 10' : isTopTenSeries ? 'Séries Top 10' : groupName;
            const rowDiv = document.createElement('div');
            rowDiv.className = homeDashboard && currentTab === 'home' ? 'home-collection-row' : 'space-y-2.5';
            rowDiv.dataset.row = rowId;
            const heading = document.createElement('h2');
            heading.className = homeDashboard && currentTab === 'home' ? 'home-collection-title' : 'text-xs lg:text-sm font-bold text-white tracking-wide';
            heading.textContent = homeDashboard && currentTab === 'home' ? displayGroupName : `${displayGroupName} (${groupItems.length})`;

            const track = document.createElement('div');
            track.id = rowId;
            track.dataset.row = rowId;
            track.className = `carousel-track ${homeDashboard && currentTab === 'home' ? 'home-collection-track' : 'space-x-3.5'} flex overflow-x-auto overflow-y-hidden no-scrollbar`;
            const visibleCount = isTopTen ? 10 : MAX_CARDS_PER_ROW;
            const visibleItems = groupItems.slice(0, visibleCount);
            visibleItems.forEach((item, index) => track.appendChild(createCatalogCard(item, isTopTen ? index + 1 : null, rowId)));
            const hasApiNextPage = (currentTab === 'movies' || currentTab === 'series') && catalogApiPages[currentTab].hasNext;
            if (groupItems.length > visibleCount || hasApiNextPage) track.appendChild(createMoreItemsCard(rowId));

            rowDiv.append(heading, track);
            return rowDiv;
        }

        function createCatalogCard(item, rank = null, rowId = '') {
            return VenusCard.createCard(item.name, item.plot, item.logo, {
                id: item.id,
                navId: `card-${item.id}`,
                rowId,
                rank,
                isTopTen: rank !== null,
                className: rank ? '' : `home-poster-card ${homeDashboard && currentTab === 'home' ? '' : 'w-40'}`,
                onClick: () => openDetailsModalById(item.id, item.type)
            });
        }

        function createMoreItemsCard(rowId) {
            const card = document.createElement('div');
            card.dataset.navId = `more-${rowId}`;
            card.dataset.row = rowId;
            card.className = 'tv-focusable card-item flex-none w-40 bg-gray-900/90 rounded-xl overflow-hidden cursor-pointer flex flex-col items-center justify-center border border-gray-800 text-center p-3';
            card.innerHTML = '<i class="fa-solid fa-circle-plus text-xl text-venus-red mb-1"></i><span class="text-xs font-bold text-gray-200">Mais títulos</span>';
            card.onclick = () => loadMoreRow(rowId);
            return card;
        }

        function sanitizeId(str) { return str.replace(/[^a-zA-Z0-9]/g, '_'); }

        async function loadMoreRow(rowId) {
            const container = document.getElementById(rowId);
            const row = catalogRows.get(rowId);
            if (!container || !row) return;
            const { items: allItems, isTopTen, type } = row;
            const moreButton = container.querySelector(`[data-nav-id="more-${rowId}"]`);
            if (moreButton) {
                moreButton.dataset.loading = 'true';
                moreButton.setAttribute('aria-label', 'Carregando mais títulos');
            }
            const currentCount = Array.from(container.children).filter(child => child !== moreButton).length;
            moreButton?.remove();
            if (currentCount >= allItems.length && type && catalogApiPages[type].hasNext) {
                try {
                    const category = catalogApiPages[type].category;
                    const page = await VenusCatalog.list(type, catalogApiPages[type].page + 1, 30, category);
                    catalogApiPages[type] = { page: page.page, hasNext: page.has_next, category };
                    catalogData[type].push(...page.items);
                    allItems.push(...page.items);
                    writeCatalogCache().catch(() => {});
                } catch (error) {
                    container.appendChild(createMoreItemsCard(rowId));
                    console.error('[Catalog] failed to load next page:', error);
                    return;
                }
            }
            const nextBatch = allItems.slice(currentCount, currentCount + batchSize);

            const fragment = document.createDocumentFragment();
            nextBatch.forEach((item, index) => fragment.appendChild(createCatalogCard(item, isTopTen ? currentCount + index + 1 : null, rowId)));

            if (currentCount + nextBatch.length < allItems.length || (type && catalogApiPages[type].hasNext)) {
                fragment.appendChild(createMoreItemsCard(rowId));
            }
            container.appendChild(fragment);
            observeLazyImages(container);
            updateFocusables();
        }

        function openSearchModal() {
            VenusSearch.open();
        }

        function closeSearchModal() {
            VenusSearch.close();
        }

        async function openDetailsModalById(id, type) {
            const all = [...catalogData.movies, ...catalogData.series];
            const item = all.find(i => i.id.toString() === id.toString() && (!type || i.type === type));
            if (item) {
                void openDetailsModal(item);
                return;
            }
            void openDetailsModal({ id: String(id), type: type || 'movies', name: 'Carregando título...' });
        }

        async function openDetailsModal(item) {
            currentSelectedItem = item;
            VenusTopbar.setVisible(false);
            document.getElementById('detailsPage').scrollTop = 0;
            document.getElementById('catalogPage').classList.add('hidden');
            document.getElementById('detailsPage').classList.remove('hidden');
            document.getElementById('detailsSkeleton').hidden = false;
            document.getElementById('detailsContent').hidden = true;

            const playBtn = document.getElementById('modalPlayBtn');
            const episodesSec = document.getElementById('seriesEpisodesSection');

            try {
                const details = await getTitleDetails(item);
                if (String(currentSelectedItem?.id) !== String(item.id)) return;
                currentSelectedItem = {
                    ...item,
                    ...details,
                    url_stream: details.url_stream || item.url_stream,
                    url: details.url || item.url,
                    detailLoaded: true
                };
                item = currentSelectedItem;
            } catch (error) {
                console.warn('[Details] public details unavailable:', error);
                if (String(currentSelectedItem?.id) !== String(item.id)) return;
            }

            document.getElementById('detailsSkeleton').hidden = true;
            document.getElementById('detailsContent').hidden = false;
            applyDetailsMetadata(currentSelectedItem);
            if (item.type === 'series') seriesInfoCache[item.id] = item;
            updateWatchlistButtonState(item.id);

            if (item.type === 'series') {
                playBtn.style.display = 'none';
                episodesSec.classList.remove('hidden');
                updateFocusables();
                await loadSeriesEpisodes(item.id);
            } else {
                playBtn.style.display = 'flex';
                document.getElementById('modalPlayText').innerText = 'Assistir';
                playBtn.onclick = () => {
                    closeDetailsModal();
                    playItem(item);
                };
                episodesSec.classList.add('hidden');
            }

            updateFocusables();
        }

        function closeDetailsModal() {
            document.getElementById('detailsPage').classList.add('hidden');
            document.getElementById('detailsSkeleton').hidden = true;
            document.getElementById('catalogPage').classList.remove('hidden');
            VenusTopbar.syncVisibility();
            updateFocusables();
        }

        async function loadSeriesEpisodes(seriesId) {
            const seasonContainer = document.getElementById('seasonSelectorContainer');
            const episodesContainer = document.getElementById('episodesListContainer');
            seasonContainer.innerHTML = `<span class="text-xs text-gray-400">Carregando temporadas...</span>`;
            episodesContainer.innerHTML = '';

            try {
                let info = seriesInfoCache[seriesId];
                if (!info) {
                    info = await VenusCatalog.details({ id: seriesId, type: 'series' });
                    seriesInfoCache[seriesId] = info;
                }

                const seriesInfo = info.apiItem || info.info || info;
                currentSelectedItem = {
                    ...currentSelectedItem,
                    titleLogo: seriesInfo.title_logo || seriesInfo.logo_title || seriesInfo.clear_logo || currentSelectedItem.titleLogo,
                    backdrop: seriesInfo.backdrop_path || seriesInfo.backdrop || seriesInfo.backdrop_url || currentSelectedItem.backdrop,
                    maturityRating: seriesInfo.mpaa_rating || seriesInfo.certification || seriesInfo.age_rating || currentSelectedItem.maturityRating,
                    audio: seriesInfo.audio_codec || seriesInfo.audio || currentSelectedItem.audio,
                    duration: seriesInfo.duration || seriesInfo.runtime || currentSelectedItem.duration,
                    durationSeconds: seriesInfo.duration_secs || currentSelectedItem.durationSeconds,
                    year: seriesInfo.releaseDate || seriesInfo.year || currentSelectedItem.year,
                    genre: seriesInfo.genre || seriesInfo.genres || currentSelectedItem.genre,
                    plot: seriesInfo.plot || currentSelectedItem.plot,
                    cast: seriesInfo.cast || currentSelectedItem.cast
                };
                applyDetailsMetadata(currentSelectedItem);

                const publicEpisodes = info.apiItem?.episodios;
                if (Array.isArray(publicEpisodes)) {
                    info.episodes = publicEpisodes.reduce((seasons, episode) => {
                        const season = String(episode.temporada || 1);
                        if (!seasons[season]) seasons[season] = [];
                        seasons[season].push({
                            id: episode.id,
                            season_num: episode.temporada,
                            episode_num: episode.episodio,
                            title: episode.titulo,
                            capa: episode.capa,
                            url_stream: episode.url_stream,
                            info: { duration: episode.duracao },
                            container_extension: 'mp4',
                            streamUrl: episode.url_stream
                        });
                        return seasons;
                    }, {});
                }

                if (info && info.episodes) {
                    const seasons = Object.keys(info.episodes).sort((a, b) => Number(a) - Number(b));
                    if (seasons.length === 0) {
                        seasonContainer.innerHTML = `<span class="text-xs text-gray-400">Nenhum episódio.</span>`;
                        return;
                    }

                    seasonContainer.replaceChildren();
                    seasons.forEach((seasonNum, idx) => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = `tv-focusable temporada-circle ${idx === 0 ? 'active' : ''} ${seasonNum.length > 2 ? 'temporada-circle--wide' : ''}`;
                        btn.dataset.navId = `season-${seasonNum}`;
                        btn.dataset.row = 'episode-seasons';
                        btn.dataset.temporada = seasonNum;
                        btn.setAttribute('aria-label', `Temporada ${seasonNum}`);
                        btn.setAttribute('aria-pressed', String(idx === 0));
                        btn.textContent = seasonNum;
                        btn.onclick = () => {
                            seasonContainer.querySelectorAll('.temporada-circle').forEach(button => {
                                const active = button === btn;
                                button.classList.toggle('active', active);
                                button.setAttribute('aria-pressed', String(active));
                            });
                            renderEpisodesList(info.episodes[seasonNum]);
                        };
                        seasonContainer.appendChild(btn);
                    });

                    renderEpisodesList(info.episodes[seasons[0]]);
                } else {
                    seasonContainer.innerHTML = `<span class="text-xs text-gray-400">Indisponível.</span>`;
                }
            } catch (e) {
                seasonContainer.innerHTML = `<span class="text-xs text-red-400">Erro.</span>`;
            }
            updateFocusables();
        }

        function renderEpisodesList(episodes) {
            const container = document.getElementById('episodesListContainer');
            container.replaceChildren();
            if (!episodes?.length) {
                const empty = document.createElement('p');
                empty.className = 'episodios-vazio';
                empty.textContent = 'Nenhum episódio encontrado para esta temporada.';
                container.appendChild(empty);
                updateFocusables();
                return;
            }

            episodes.forEach((ep, index) => {
                const episodeUrl = ep.streamUrl || ep.url_stream || '';
                const card = document.createElement('button');
                card.type = 'button';
                card.className = 'tv-focusable episodio-card';
                card.dataset.navId = `episode-${ep.id}`;
                card.dataset.row = 'episode-cards';
                card.dataset.id = ep.id;
                card.dataset.url = episodeUrl;
                card.setAttribute('aria-label', `Episódio ${ep.episode_num || index + 1}${ep.title ? `: ${ep.title}` : ''}${ep.info?.duration ? `, duração ${ep.info.duration}` : ''}`);

                const thumbnail = document.createElement('span');
                thumbnail.className = 'episodio-thumb';
                const fallback = document.createElement('span');
                fallback.className = 'episodio-thumb__fallback';
                fallback.setAttribute('aria-hidden', 'true');
                fallback.innerHTML = '<i class="fa-solid fa-film"></i>';
                thumbnail.appendChild(fallback);

                if (ep.capa) {
                    const image = document.createElement('img');
                    image.src = ep.capa;
                    image.alt = '';
                    image.loading = 'lazy';
                    image.decoding = 'async';
                    image.addEventListener('load', () => { fallback.hidden = true; }, { once: true });
                    image.addEventListener('error', () => { image.hidden = true; }, { once: true });
                    thumbnail.appendChild(image);
                }

                const overlay = document.createElement('span');
                overlay.className = 'episodio-play-overlay';
                overlay.setAttribute('aria-hidden', 'true');
                overlay.innerHTML = '<span>▶</span>';
                thumbnail.appendChild(overlay);

                const information = document.createElement('span');
                information.className = 'episodio-info';
                const episodeNumber = document.createElement('span');
                episodeNumber.className = 'episodio-numero';
                episodeNumber.textContent = `Episódio ${ep.episode_num || index + 1}`;
                information.appendChild(episodeNumber);
                const duration = ep.info?.duration;
                if (duration) {
                    const durationLabel = document.createElement('span');
                    durationLabel.className = 'episodio-duracao';
                    durationLabel.textContent = duration;
                    information.appendChild(durationLabel);
                }

                card.append(thumbnail, information);
                card.addEventListener('focus', () => card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }));
                card.onclick = () => {
                    closeDetailsModal();
                    playItem({
                        name: `${currentSelectedItem.name} - Ep ${ep.episode_num || index + 1}`,
                        url_stream: episodeUrl,
                        url: episodeUrl,
                        streamExtension: ep.container_extension || 'mp4'
                    });
                };
                container.appendChild(card);
            });
            updateFocusables();
        }

        function playItem(item) {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('videoElement');
            const errorDiv = document.getElementById('playerError');
            const titleSpan = document.getElementById('playerTitle');

            titleSpan.innerText = item.name;
            modal.classList.remove('hidden');
            VenusTopbar.setVisible(false);
            errorDiv.style.display = 'none';
            video.style.display = 'block';

            if (currentHls) { currentHls.destroy(); currentHls = null; }

            const streamUrl = item.url_stream || item.url || item.apiItem?.url_stream || '';
            if (!streamUrl) {
                video.style.display = 'none';
                errorDiv.style.display = 'block';
                updateFocusables();
                return;
            }
            const extension = (item.streamExtension || streamUrl.split('.').pop() || '').toLowerCase();
            if (Hls.isSupported() && (extension === 'm3u8' || extension === 'ts')) {
                const hls = new Hls();
                currentHls = hls;
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(e => {}); });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        video.style.display = 'none';
                        errorDiv.style.display = 'block';
                        document.getElementById('externalPlayerLink').href = streamUrl;
                    }
                });
            } else {
                video.src = streamUrl;
                video.play().catch(e => {
                    video.style.display = 'none';
                    errorDiv.style.display = 'block';
                    document.getElementById('externalPlayerLink').href = streamUrl;
                });
            }
            updateFocusables();
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('videoElement');
            video.pause();
            video.src = '';
            if (currentHls) { currentHls.destroy(); currentHls = null; }
            modal.classList.add('hidden');
            VenusTopbar.syncVisibility();
            updateFocusables();
        }

        function toggleWatchlist(id) {
            const strId = id.toString();
            const index = watchlist.indexOf(strId);
            if (index > -1) watchlist.splice(index, 1);
            else watchlist.push(strId);
            localStorage.setItem('venus_watchlist_tv', JSON.stringify(watchlist));
            updateWatchlistButtonState(id);
            syncHeroWatchlistButton();
        }

        function updateWatchlistButtonState(id) {
            const isSaved = watchlist.includes(id.toString());
            const icon = document.getElementById('modalWatchlistIcon');
            const button = document.getElementById('modalWatchlistButton');
            if (icon && button) {
                icon.className = isSaved ? 'fa-solid fa-check' : 'fa-solid fa-plus';
                button.setAttribute('aria-label', isSaved ? 'Remover da Minha Lista' : 'Adicionar à Minha Lista');
                button.title = isSaved ? 'Remover da Minha Lista' : 'Minha Lista';
            }
        }

        function toggleWatchlistFromModal() {
            if (currentSelectedItem) toggleWatchlist(currentSelectedItem.id);
        }

        // --- TV REMOTE CONTROL NAVIGATION ENGINE (D-PAD) ---
        function updateFocusables() {
            focusableElements = VenusSpatialNav.refresh();
            focusedElement = focusableElements.includes(document.activeElement)
                ? document.activeElement
                : focusableElements.find(element => element.classList.contains('focused')) || null;
        }

        function setFocus(element) {
            if (typeof element === 'number') element = focusableElements[element];
            if (element) VenusSpatialNav.focus(element);
        }

        function syncFocusedElement(element) {
            if (focusedElement && focusedElement !== element) focusedElement.classList.remove('focused');
            focusedElement = element;
            element?.classList.add('focused');
        }

        function handleBackNavigation() {
            if (!document.getElementById('searchModal').classList.contains('hidden')) closeSearchModal();
            else if (!document.getElementById('detailsPage').classList.contains('hidden')) closeDetailsModal();
            else if (!document.getElementById('playerModal').classList.contains('hidden')) closePlayer();
            else return false;
            return true;
        }
    </script>
